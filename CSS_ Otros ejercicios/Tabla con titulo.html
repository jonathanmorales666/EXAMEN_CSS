<!DOCTYPE html><!-- Tipo de documento-->
<!-- Jonathan Gabriel Morales Torres - 5to Computación "B" - Clave 10 -->
<html lang="en"><!-- Idioma del documento-->
<head><!-- Encabezado-->
    <meta charset="UTF-8"><!-- Permite la Ñ-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- Tamaño adaptable-->
    <title>Tabla en HTML con título</title><!-- Título-->
</head><!-- Cerramos el encabezado-->
<body><!-- Cuerpo del documento-->
    <table border="1"><!-- Tabla con borde 1-->
        <caption>Población de los paises con 
            mayor cantidad de habitantes.</caption><!-- Título arriba de la tabla-->
        <tr><!-- Fila 1-->
            <th>Paises</th><!-- Columna elemento 1-->
            <th>Cantidad de habitantes</th><!-- Columna elemento 2-->
        </tr><!-- Cerramos fila-->
        <tr><!--Abrimos elemento de columna-->
            <td>China</td><!-- Columna elemento 1-->
            <td>1300 millones</td><!-- Columna elemento 2-->
        </tr><!-- Cerramos fila-->
        <tr><!--Abrimos elemento de columna-->
            <td>India</td><!-- Columna elemento 1-->
            <td>1080 millones</td><!-- Columna elemento 2-->
        </tr><!-- Cerramos fila-->
        <tr><!--Abrimos elemento de columna-->
            <td>Estados Unidos</td><!-- Columna elemento 1-->
            <td>295 millones</td><!-- Columna elemento 2-->
        </tr><!-- Cerramos fila-->
    </table><!-- Cerramos tabla-->
</body><!-- Cerramos el cuerpo-->
</html><!-- Cerramos el documento-->
