<!DOCTYPE html><!-- Tipo de documento-->
<!-- Jonathan Gabriel Morales Torres - 5to Computación "B" - Clave 10 -->
<html lang="en"><!-- Idioma del documento-->
<head><!-- Encabezado-->
    <meta charset="UTF-8"><!-- Permite la Ñ-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- Tamaño adaptable-->
    <title>Tabla y combinación en HTML</title><!-- Título-->
</head><!-- Cerramos el encabezado-->
<body><!-- Cuerpo del documento-->
   <table border="1"><!-- Abrimos tabla-->
  <tr>
    <td rowspan="4">Recursos</td><!-- Tabla que ocupa 4 espacios vertical-->
    <td colspan="4">Facturación de los últimos tres meses</td><!-- Tabla que ocupa 4 espacios horizontal-->
  </tr>
  <tr>
    <td>Discos Duros</td><td>23000</td><!-- Elementos en fila-->
    <td>27200</td><td>26000</td><!-- Elementos en fila-->
  </tr>
  <tr>
    <td>CPU</td><td>73000</td><td>67300</td><!-- Elementos en fila-->
    <td>51000</td><!-- Elementos en fila-->
  </tr>
  <tr>
    <td>Monitores</td><td>53000</td><!-- Elementos en fila-->
    <td>72000</td><td>88000</td><!-- Elementos en fila-->
  </tr>
</table><!-- Cerramos tabla-->
</body><!-- Cerramos el cuerpo-->
</html><!-- Cerramos el documento-->
