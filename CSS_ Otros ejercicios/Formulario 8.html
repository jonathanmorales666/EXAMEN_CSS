<!DOCTYPE html><!-- Tipo de documento-->

<html lang="en"><!-- Idioma del documento-->
<head><!-- Encabezado-->
    <meta charset="UTF-8"><!-- Permite la Ñ-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- Tamaño adaptable-->
    <title>Tabla en HTML</title><!-- Título-->
</head><!-- Cerramos el encabezado-->
<body><!-- Cuerpo del documento-->
    <form action="registrardatos.php" method="post"><!-- Formulario y tipo-->
        Seleccione una fruta o verdura:<!-- Imprime-->
        <select name="articulo"><!-- Caja de selección múltiple-->
            <optgroup label="Frutas"><!-- Título por separado-->
                <option value="1">Naranjas</option>
                <option value="2">Manzanas</option>
                <option value="3">Sandia</option>
                <option value="4">Frutilla</option>
                <option value="5">Durazno</option>
                <option value="6">Ciruela</option>
            </optgroup><!-- Cerramos sub-grupo-->
            <optgroup label="Verduras"><!-- Otro título o grupo por separado-->
                <option value="7">Lechuga</option>
                <option value="8">Acelga</option>
                <option value="9">Zapallo</option>
                <option value="10">Papas</option>
                <option value="11">Batatas</option>
                <option value="13">Zanahorias</option>
                <option value="14">Rabanitos</option>
                <option value="15">Calabaza</option>
            </optgroup><!-- Cerramos sub-grupo-->
        </select><!-- Cerramos la caja-->
        <br><!-- Salto de línea-->
        <input type="submit" value="Enviar"><!-- Botón enviar con método enviar xd-->
    </form><!-- Cerramos formulario-->
</body><!-- Cerramos el cuerpo-->
</html><!-- Cerramos el documento-->
