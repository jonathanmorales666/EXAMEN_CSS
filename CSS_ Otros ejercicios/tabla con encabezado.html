<!DOCTYPE html><!-- Tipo de documento-->
<!-- Jonathan Gabriel Morales Torres - 5to Computación "B" - Clave 10 -->
<html lang="en"><!-- Idioma del documento-->
<head><!-- Encabezado-->
    <meta charset="UTF-8"><!-- Permite la Ñ-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- Tamaño adaptable-->
    <title>Tabla en HTML con encabezado</title><!-- Título-->
</head><!-- Cerramos el encabezado-->
<body><!-- Cuerpo del documento-->
    <table border="1"><!-- Tabla, con tamaño de borde 1-->
        <tr><!-- Fila 1-->
            <th>Paises</th><!-- TH para texto centrado y negrita-->
            <th>Cantidad de habitantes</th><!-- TH para texto centrado y negrita-->
        </tr><!-- Cerramos fila-->
        <tr>
            <td>China</td><!-- Elemento columna 1-->
            <td>1300 millones</td><!-- Elemento columna 2-->
        </tr><!-- Cerramos fila-->
        <tr>
            <td>India</td><!-- Elemento columna 1-->
            <td>1080 millones</td><!-- Elemento columna 2-->
        </tr><!-- Cerramos fila-->
        <tr>
            <td>Estados Unidos</td><!-- Elemento columna 1-->
            <td>295 millones</td><!-- Elemento columna 2-->
        </tr><!-- Cerramos fila-->
    </table><!-- Cerramos tabla-->
</body><!-- Cerramos el cuerpo-->
</html><!-- Cerramos el documento-->
